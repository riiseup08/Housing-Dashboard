name: Weekly data refresh

on:
  schedule:
    # Tuesdays at 12:00 UTC. StatsCan typically publishes mid-month;
    # a weekly tick catches new NHPI / housing-starts releases within a week.
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write   # git-auto-commit-action needs to push refreshed CSVs

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (extract + load + strict checks)
        run: python run_pipeline.py --load-db --strict

      - name: Run unit tests
        run: pytest tests/ -m "not slow" --maxfail=1

      - name: Migrate data to PostgreSQL
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Migrating data to PostgreSQL..."
          python migrate_to_postgres.py

      - name: Upload DuckDB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: housing-duckdb-${{ github.run_number }}
          path: data/housing.duckdb
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit refreshed CSVs
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): weekly refresh ${{ github.run_id }}"
          file_pattern: "data/processed/*.csv"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
